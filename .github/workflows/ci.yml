name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Tool-count drift check
        run: |
          ACTUAL=$(grep -c "meta: [A-Za-z]*ToolMeta" src/core/tools/index.ts)
          # Check AGENTS.md and README.md don't hardcode a stale count
          if grep -nE '[0-9]+ (tools|typed tools)' AGENTS.md README.md 2>/dev/null | grep -v 'grep -c' ; then
            echo "::warning::AGENTS.md or README.md may hardcode a tool count. Use the audit command instead."
          fi
          echo "Registered tools: $ACTUAL"
