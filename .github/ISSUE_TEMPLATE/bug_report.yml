name: Bug report
description: Report a bug in the pCloud MCP server
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the sections below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: What you saw vs. what you expected
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install `bun install`
        2. Set `PCLOUD_ACCESS_TOKEN`
        3. Run `bun run dev`
        4. Call tool X with args Y
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: macOS 14 / Ubuntu 22 / Windows 11
        - Bun: 1.3.x
        - mcporter: 0.15.x
        - pCloud region: EU (eapi.pcloud.com) / US / other
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error messages
      placeholder: |
        ```
        error output here
        ```
    validations:
      required: false
